<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Edit Employee</h1>

    <form action="/update/{{ employee[0] }}" method="POST">

        <input
            type="text"
            name="name"
            value="{{ employee[1] }}"
            required>

        <input
            type="email"
            name="email"
            value="{{ employee[2] }}"
            required>

        <input
            type="text"
            name="department"
            value="{{ employee[3] }}"
            required>

        <button type="submit">
            Update Employee
        </button>

    </form>

</body>
</html>
